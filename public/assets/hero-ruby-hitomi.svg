    <circle cx="566" cy="128" r="5" fill="#b9893b"/>
    <circle cx="598" cy="564" r="4" fill="#b9893b"/>
    <circle cx="162" cy="580" r="5" fill="#b9893b"/>
    <path d="M176 200l8 14 16 2-12 10 3 15-15-7-14 7 2-15-11-10 16-2z" fill="#d6bb74" opacity=".8"/>
    <path d="M580 234l7 12 14 2-10 9 3 14-14-6-12 6 2-14-10-9 14-2z" fill="#d6bb74" opacity=".72"/>
  </g>


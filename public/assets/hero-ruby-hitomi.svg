<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-label="タロットカードを重ねたルビー瞳のビジュアル">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff9f6"/>
      <stop offset="1" stop-color="#f8dfe5"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fffdfb"/>
      <stop offset="1" stop-color="#f8e5ea"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#4d1730"/>
      <stop offset="1" stop-color="#8a2344"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#e7d7a8"/>
      <stop offset="1" stop-color="#b9893b"/>
    </linearGradient>
    <radialGradient id="rubyGlow" cx="50%" cy="42%" r="52%">
      <stop stop-color="#f8d0db"/>
      <stop offset=".55" stop-color="#b53457"/>
      <stop offset="1" stop-color="#56172f"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#4b2032" flood-opacity=".18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="720" rx="40" fill="url(#bg)"/>
  <circle cx="360" cy="338" r="268" fill="#ffffff" opacity=".45"/>
  <circle cx="360" cy="338" r="216" fill="#f8dfe5" opacity=".58"/>
  <circle cx="360" cy="346" r="176" fill="#ffffff" opacity=".72"/>


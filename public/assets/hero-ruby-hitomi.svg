      <path d="M304 182h114M304 496h114" stroke="#caa85a" stroke-linecap="round"/>
      <circle cx="361" cy="206" r="18" fill="none" stroke="#b9893b" stroke-width="2"/>
      <path d="M338 206h46M361 183v46" stroke="#b9893b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="361" cy="340" r="92" fill="url(#rubyGlow)" filter="url(#glow)"/>
      <circle cx="361" cy="340" r="74" fill="none" stroke="#f7e7bf" stroke-width="3"/>
      <path d="M361 264c31 36 49 62 49 94a49 49 0 0 1-98 0c0-32 18-58 49-94z" fill="none" stroke="#f9ebc7" stroke-width="3"/>
      <path d="M315 392c13-10 29-15 46-15s33 5 46 15c-12 23-28 35-46 35s-34-12-46-35z" fill="#f9ebc7" opacity=".24" stroke="#f9ebc7" stroke-width="2"/>
      <path d="M292 455c20-16 43-24 69-24s49 8 69 24" fill="none" stroke="#b9893b" stroke-width="2.5" stroke-linecap="round"/>

      <circle cx="513" cy="274" r="34" fill="none" stroke="#e7d7a8" stroke-width="2"/>
      <path d="M490 276c15-22 31-34 49-34 4 24-1 45-16 62-17 18-36 27-59 26 1-22 10-40 26-54z" fill="none" stroke="#e7d7a8" stroke-width="2"/>

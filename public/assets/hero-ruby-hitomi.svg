      <path d="M168 230h92M168 500h92" stroke="#b9893b" stroke-linecap="round" opacity=".5"/>
    </g>

    <g transform="rotate(14 520 344)">
      <rect x="420" y="154" width="186" height="352" rx="22" fill="#441328"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ルビー瞳のOGP画像">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fffaf7"/>
      <stop offset="1" stop-color="#f5dce5"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fffefd"/>
      <stop offset="1" stop-color="#fae8ee"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#4c1730"/>
      <stop offset="1" stop-color="#942448"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ecd8ab"/>
      <stop offset="1" stop-color="#b9893b"/>
    </linearGradient>
    <radialGradient id="ruby" cx="50%" cy="45%" r="55%">
      <stop stop-color="#ffd8e0"/>
      <stop offset=".55" stop-color="#be355a"/>
      <stop offset="1" stop-color="#59182f"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#4b2032" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="876" cy="304" r="220" fill="#ffffff" opacity=".45"/>
  <circle cx="876" cy="304" r="174" fill="#f8dfe5" opacity=".72"/>

  <g>
    <text x="90" y="170" fill="#8d2041" font-size="60" font-family="serif">ルビー瞳</text>
    <text x="90" y="238" fill="#4a2030" font-size="32" font-family="sans-serif">恋愛・復縁・相手の気持ちに寄り添う占い鑑定</text>
    <text x="90" y="292" fill="#6d5862" font-size="26" font-family="sans-serif">タロット / ルノルマンカード / 鑑定実績6000件以上</text>
    <text x="90" y="384" fill="#6d5862" font-size="24" font-family="sans-serif">優しく、丁寧に、安心して話せるオンライン鑑定</text>
  </g>

  <g filter="url(#shadow)">
    <g transform="rotate(-10 810 344)">
      <rect x="708" y="164" width="190" height="316" rx="22" fill="url(#cardBack)"/>
      <rect x="722" y="178" width="162" height="288" rx="16" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <rect x="738" y="194" width="130" height="256" rx="12" fill="#5f1e39" opacity=".5" stroke="#d8ba73" stroke-width="1.5"/>
      <circle cx="803" cy="274" r="34" fill="none" stroke="#eedfb2" stroke-width="2"/>
      <path d="M803 244c18 22 28 39 28 58a28 28 0 0 1-56 0c0-19 10-36 28-58z" fill="none" stroke="#eedfb2" stroke-width="2"/>
    </g>

    <g>
      <rect x="806" y="106" width="224" height="372" rx="28" fill="url(#cardFace)"/>
      <rect x="822" y="122" width="192" height="340" rx="20" fill="none" stroke="url(#gold)" stroke-width="4"/>
      <rect x="842" y="142" width="152" height="300" rx="18" fill="#fffaf7" stroke="#d6b46b" stroke-width="1.5"/>
      <path d="M870 176h96M870 406h96" stroke="#c79f50" stroke-linecap="round"/>
      <circle cx="918" cy="200" r="16" fill="none" stroke="#b9893b" stroke-width="2"/>
      <path d="M918 184v32M902 200h32" stroke="#b9893b" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="918" cy="296" r="76" fill="url(#ruby)"/>
      <circle cx="918" cy="296" r="58" fill="none" stroke="#f6e8c3" stroke-width="3"/>
      <path d="M918 236c24 28 38 49 38 74a38 38 0 0 1-76 0c0-25 14-46 38-74z" fill="none" stroke="#f8ebcb" stroke-width="3"/>
      <path d="M884 354c10-8 22-12 34-12s24 4 34 12c-9 17-20 26-34 26s-25-9-34-26z" fill="#f6e8c3" opacity=".22" stroke="#f6e8c3" stroke-width="2"/>
    </g>
  </g>
</svg>
